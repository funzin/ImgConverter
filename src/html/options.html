<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>ImgConverter options</title>
  <style>
    label {
      display: inline-block;
      min-width: 4.5em;
    }
    #size-hint {
      color: gray;
    }
    input[aria-invalid="true"] {
      outline: 2px solid red;
    }
    #status {
      min-height: 1.2em;
    }
    form:has([aria-invalid="true"]) #status {
      color: red;
    }
  </style>
  <script src="../js/options.js" defer></script>
</head>

<body>
  <form id="size-form">
    <p>ImgConverter adds this width and height to each new &lt;img&gt; tag. If both are empty, it adds width="50%".</p>
    <label for="width">Width</label>
    <input id="width" type="text" aria-describedby="size-hint">
    <br>
    <label for="height">Height</label>
    <input id="height" type="text" aria-describedby="size-hint">
    <p id="size-hint">Use digits, optionally followed by px or %, like 200px or 50%.</p>
    <button id="save" type="submit">Save</button>
    <p id="status" role="status"></p>
  </form>
</body>

</html>
