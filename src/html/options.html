<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="../js/options.js"></script>
</head>

<body>
  ImgConverter adds the width and height below to each new &lt;img&gt; tag. Enter only the value, such as 200px or 50%. If both fields are empty, ImgConverter adds width=50%.
  <table>
    <tr>
      <td>width: </td>
      <td><input id="width" type="text"></td>
    </tr>

    <tr>
      <td>height: </td>
      <td><input id="height" type="text"></td>
    </tr>

  </table>
  <br>

  <input id="save" type="button" value="Save">
</body>

</html>
